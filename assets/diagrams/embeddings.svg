<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How Embeddings map text to vectors">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Embeddings: Turning Meaning into Coordinates</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">An embedding model converts text into a fixed list of numbers so math can compare meaning.</text>

  <!-- Left Pipeline -->
  <rect x="45" y="122" width="165" height="60" rx="12" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="127" y="150" text-anchor="middle">"puppy"</text>
  <text class="box-sub" x="127" y="170" text-anchor="middle">Input text</text>

  <rect x="45" y="212" width="165" height="60" rx="12" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="127" y="240" text-anchor="middle">"dog"</text>
  <text class="box-sub" x="127" y="260" text-anchor="middle">Similar meaning</text>

  <rect x="45" y="302" width="165" height="60" rx="12" fill="#fee2e2" class="stroke-main" />
  <text class="box-title" x="127" y="330" text-anchor="middle">"laptop"</text>
  <text class="box-sub" x="127" y="350" text-anchor="middle">Unrelated meaning</text>

  <!-- Arrows to Model -->
  <line class="arrow" x1="210" y1="152" x2="262" y2="225" />
  <line class="arrow" x1="210" y1="242" x2="262" y2="242" />
  <line class="arrow" x1="210" y1="332" x2="262" y2="259" />

  <!-- Embedding Model -->
  <rect x="266" y="175" width="150" height="134" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="341" y="226" text-anchor="middle">Embedding</text>
  <text class="box-title" x="341" y="248" text-anchor="middle">Model</text>
  <text class="box-sub" x="341" y="278" text-anchor="middle">e.g. 1536 dims</text>

  <!-- Arrows to Vectors -->
  <line class="arrow" x1="416" y1="220" x2="458" y2="152" />
  <line class="arrow" x1="416" y1="242" x2="458" y2="242" />
  <line class="arrow" x1="416" y1="264" x2="458" y2="332" />

  <!-- Vectors -->
  <rect x="462" y="122" width="205" height="60" rx="10" fill="#fef3c7" class="stroke-main" />
  <text class="mono" x="564" y="149" text-anchor="middle">[0.81, 0.19, -0.42, ...]</text>
  <text class="box-sub" x="564" y="170" text-anchor="middle">Vector A (1536 floats)</text>

  <rect x="462" y="212" width="205" height="60" rx="10" fill="#fef3c7" class="stroke-main" />
  <text class="mono" x="564" y="239" text-anchor="middle">[0.79, 0.22, -0.40, ...]</text>
  <text class="box-sub" x="564" y="260" text-anchor="middle">Vector B (close to A)</text>

  <rect x="462" y="302" width="205" height="60" rx="10" fill="#f1f5f9" class="stroke-main" />
  <text class="mono" x="564" y="329" text-anchor="middle">[-0.63, 0.88, 0.12, ...]</text>
  <text class="box-sub" x="564" y="350" text-anchor="middle">Vector C (far from A &amp; B)</text>

  <!-- Semantic Space Map -->
  <rect x="695" y="122" width="220" height="240" rx="14" fill="#f8fafc" class="stroke-main" />
  <text class="box-title" x="805" y="148" text-anchor="middle">Vector Space (2D view)</text>
  <line x1="720" y1="335" x2="890" y2="335" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="720" y1="335" x2="720" y2="170" stroke="#94a3b8" stroke-width="1.5" />

  <circle cx="765" cy="210" r="8" fill="#3b82f6" stroke="#1e293b" stroke-width="1.8" />
  <text class="box-sub" x="780" y="206" font-weight="700">puppy</text>

  <circle cx="785" cy="232" r="8" fill="#3b82f6" stroke="#1e293b" stroke-width="1.8" />
  <text class="box-sub" x="800" y="238" font-weight="700">dog</text>

  <line x1="765" y1="210" x2="785" y2="232" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />
  <text class="box-sub" x="748" y="264" fill="#065f46" font-weight="700">Close = Similar</text>

  <circle cx="865" cy="300" r="8" fill="#ef4444" stroke="#1e293b" stroke-width="1.8" />
  <text class="box-sub" x="855" y="286" text-anchor="middle" font-weight="700">laptop</text>

  <rect x="135" y="405" width="690" height="52" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="436" text-anchor="middle">Powers semantic search, RAG, recommendations &amp; clustering without exact keyword matches</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
