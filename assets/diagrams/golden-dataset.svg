<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Anatomy of a Golden Dataset</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Curated, human-verified ground truth for fast, reliable automated evals</text>

  <rect x="72" y="134" width="392" height="148" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="268" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Real Prod Inputs</text>
  <line x1="104" y1="196" x2="432" y2="196" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="268" y="228" text-anchor="middle" font-size="14" fill="#1e293b">50–500 representative queries</text>
  <text x="268" y="254" text-anchor="middle" font-size="14" fill="#1e293b">Covers common + tricky edge cases</text>
  <rect x="496" y="134" width="392" height="148" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="692" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Expected Outputs</text>
  <line x1="528" y1="196" x2="856" y2="196" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="692" y="228" text-anchor="middle" font-size="14" fill="#1e293b">Verified answers or JSON targets</text>
  <text x="692" y="254" text-anchor="middle" font-size="14" fill="#1e293b">Or clear grading rubrics</text>
  <rect x="72" y="306" width="392" height="148" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="268" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Strict Isolation</text>
  <line x1="104" y1="368" x2="432" y2="368" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="268" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Never used in model training</text>
  <text x="268" y="426" text-anchor="middle" font-size="14" fill="#1e293b">Prevents data leakage &amp; cheating</text>
  <rect x="496" y="306" width="392" height="148" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="692" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Living Versioned Set</text>
  <line x1="528" y1="368" x2="856" y2="368" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="692" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Add new prod bugs over time</text>
  <text x="692" y="426" text-anchor="middle" font-size="14" fill="#1e293b">Turns every fix into a permanent test</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">AI Dictionary — datsanta.com</text>
</svg>