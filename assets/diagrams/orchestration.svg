<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AI Orchestration pipeline control">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Orchestration: Coordinating Reliable AI Steps</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Deterministic code manages routing, parallel calls, retries, state, and fallbacks around LLM steps.</text>

  <!-- Step 1: Router -->
  <rect x="45" y="195" width="165" height="115" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="127" y="236" text-anchor="middle">1. Router</text>
  <text class="box-sub" x="127" y="262" text-anchor="middle">Classifies intent &amp;</text>
  <text class="box-sub" x="127" y="280" text-anchor="middle">picks right path</text>

  <!-- Branch Arrows -->
  <line class="arrow" x1="210" y1="230" x2="275" y2="170" />
  <line class="arrow" x1="210" y1="252" x2="275" y2="252" />
  <line class="arrow" x1="210" y1="274" x2="275" y2="334" />

  <!-- Parallel Steps -->
  <rect x="280" y="130" width="210" height="72" rx="12" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="385" y="160" text-anchor="middle">Worker A: RAG Search</text>
  <text class="box-sub" x="385" y="182" text-anchor="middle">Timeout: 3s | Retries: 2</text>

  <rect x="280" y="216" width="210" height="72" rx="12" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="385" y="246" text-anchor="middle">Worker B: SQL Tool</text>
  <text class="box-sub" x="385" y="268" text-anchor="middle">Runs in parallel</text>

  <rect x="280" y="302" width="210" height="72" rx="12" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="385" y="332" text-anchor="middle">Fallback Model</text>
  <text class="box-sub" x="385" y="354" text-anchor="middle">If primary hits 429 / 500</text>

  <!-- Converge -->
  <line class="arrow" x1="490" y1="166" x2="555" y2="232" />
  <line class="arrow" x1="490" y1="252" x2="555" y2="252" />
  <line class="arrow" x1="490" y1="338" x2="555" y2="272" />

  <!-- State & Checkpoints -->
  <rect x="560" y="175" width="175" height="150" rx="14" fill="#f1f5f9" class="stroke-main" />
  <text class="box-title" x="647" y="218" text-anchor="middle">2. State Store</text>
  <text class="box-sub" x="647" y="248" text-anchor="middle">Checkpoints progress,</text>
  <text class="box-sub" x="647" y="268" text-anchor="middle">validates schema &amp;</text>
  <text class="box-sub" x="647" y="288" text-anchor="middle">logs trace/latency</text>

  <line class="arrow" x1="735" y1="250" x2="770" y2="250" />
  <polyline class="arrow" points="760,242 771,250 760,258" />

  <!-- Output -->
  <rect x="775" y="195" width="140" height="115" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="845" y="236" text-anchor="middle">3. Output</text>
  <text class="box-sub" x="845" y="264" text-anchor="middle">Reliable final</text>
  <text class="box-sub" x="845" y="282" text-anchor="middle">response</text>

  <rect x="145" y="405" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Rule: Don't force 1 giant prompt to do everything — break tasks into orchestrated steps</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
