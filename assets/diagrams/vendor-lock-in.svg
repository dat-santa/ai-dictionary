<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AI Vendor Lock-in vs Portable Setup">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #334155; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">Vendor Lock-in in AI</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Getting tied so tightly to one AI provider that switching becomes too costly.</text>

  <!-- Left: Locked-in -->
  <rect x="70" y="145" width="380" height="225" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="card-title" x="260" y="188" text-anchor="middle">Locked-in Setup</text>
  <text class="box-sub" x="260" y="230" text-anchor="middle">✗ Everything built for 1 vendor only</text>
  <text class="box-sub" x="260" y="260" text-anchor="middle">✗ Hard to export data &amp; prompts</text>
  <text class="box-sub" x="260" y="290" text-anchor="middle">✗ Stuck if prices jump or quality drops</text>

  <!-- Right: Portable -->
  <rect x="510" y="145" width="380" height="225" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="card-title" x="700" y="188" text-anchor="middle">Flexible Setup</text>
  <text class="box-sub" x="700" y="230" text-anchor="middle">✓ Keep your own data &amp; prompts</text>
  <text class="box-sub" x="700" y="260" text-anchor="middle">✓ Easy to swap AI models anytime</text>
  <text class="box-sub" x="700" y="290" text-anchor="middle">✓ Better leverage on price &amp; speed</text>

  <rect x="195" y="410" width="570" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="440" text-anchor="middle">Own your data &amp; prompts — treat AI models like interchangeable engines</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
