<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="AI Governance pillars">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">AI Governance in Simple Terms</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Clear company rules so teams can use AI safely without slowing down.</text>

  <!-- Pillar 1 -->
  <rect x="65" y="155" width="255" height="175" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="192" y="200" text-anchor="middle">1. Approved Tools</text>
  <text class="box-sub" x="192" y="236" text-anchor="middle">Which AI apps are</text>
  <text class="box-sub" x="192" y="258" text-anchor="middle">allowed at work</text>
  <text class="box-sub" x="192" y="280" text-anchor="middle">&amp; who pays for them</text>

  <!-- Pillar 2 -->
  <rect x="352" y="155" width="255" height="175" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="480" y="200" text-anchor="middle">2. Data Rules</text>
  <text class="box-sub" x="480" y="236" text-anchor="middle">What data is safe to</text>
  <text class="box-sub" x="480" y="258" text-anchor="middle">share vs. never paste</text>
  <text class="box-sub" x="480" y="280" text-anchor="middle">(salaries, client IDs)</text>

  <!-- Pillar 3 -->
  <rect x="640" y="155" width="255" height="175" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="767" y="200" text-anchor="middle">3. Accountability</text>
  <text class="box-sub" x="767" y="236" text-anchor="middle">Who reviews outputs</text>
  <text class="box-sub" x="767" y="258" text-anchor="middle">&amp; owns responsibility</text>
  <text class="box-sub" x="767" y="280" text-anchor="middle">when AI makes a mistake</text>

  <rect x="195" y="385" width="570" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="415" text-anchor="middle">Good governance = Traffic lights that keep everyone moving safely</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
