<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Standard Attention vs FlashAttention</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Tiling attention inside fast on-chip SRAM avoids slow GPU memory round-trips</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">STANDARD ATTENTION</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Memory Bottleneck O(N²)</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Writes huge N×N matrix to HBM</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Slow GPU memory round-trips</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Runs out of VRAM on long text</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Compute cores sit idle waiting</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">FLASHATTENTION</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Tiled SRAM Exact Speedup</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Processes small blocks in fast SRAM</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Never materializes full N×N matrix</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Exact same math output (zero loss)</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">2–4x faster &amp; linear VRAM usage</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">AI Dictionary — datsanta.com</text>
</svg>