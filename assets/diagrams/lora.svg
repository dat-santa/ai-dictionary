<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="LoRA Low-Rank Adaptation fine-tuning">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">LoRA (Low-Rank Adaptation)</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Freezes the huge base model and trains tiny sidecar adapter matrices (~0.5% of parameters).</text>

  <!-- Input -->
  <rect x="45" y="210" width="135" height="90" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="112" y="250" text-anchor="middle">Input x</text>
  <text class="box-sub" x="112" y="274" text-anchor="middle">Token vector</text>

  <!-- Split to Base and LoRA -->
  <line class="arrow" x1="180" y1="240" x2="255" y2="185" />
  <line class="arrow" x1="180" y1="270" x2="255" y2="320" />

  <!-- Frozen Base Weights -->
  <rect x="260" y="125" width="335" height="115" rx="14" fill="#f1f5f9" class="stroke-main" />
  <text class="box-title" x="427" y="160" text-anchor="middle">Frozen Pretrained Weights (W)</text>
  <text class="mono" x="427" y="188" text-anchor="middle">7,000,000,000 params (14 GB) — 🔒 FROZEN</text>
  <text class="box-sub" x="427" y="216" text-anchor="middle">Never updated during fine-tuning → saves VRAM</text>

  <!-- Trainable LoRA Adapter -->
  <rect x="260" y="262" width="335" height="122" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" />
  <text class="box-title" x="427" y="294" text-anchor="middle">Trainable LoRA Adapter (A × B)</text>
  <rect x="285" y="310" width="125" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="347" y="337" text-anchor="middle">A (d × r)</text>
  <text class="mono" x="427" y="337" text-anchor="middle">×</text>
  <rect x="445" y="310" width="125" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="507" y="337" text-anchor="middle">B (r × d)</text>
  <text class="box-sub" x="427" y="373" text-anchor="middle">Only ~30 MB! Fast to train on 1 GPU</text>

  <!-- Merge (+) -->
  <line class="arrow" x1="595" y1="182" x2="665" y2="238" />
  <line class="arrow" x1="595" y1="322" x2="665" y2="268" />

  <circle cx="690" cy="252" r="24" fill="#ede9fe" stroke="#6366f1" stroke-width="2.5" />
  <text x="690" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#1e293b">+</text>

  <line class="arrow" x1="714" y1="252" x2="755" y2="252" />
  <polyline class="arrow" points="745,244 756,252 745,260" />

  <!-- Output -->
  <rect x="760" y="190" width="155" height="125" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="837" y="232" text-anchor="middle">Output</text>
  <text class="mono" x="837" y="258" text-anchor="middle">W·x + (B·A)·x</text>
  <text class="box-sub" x="837" y="286" text-anchor="middle">Hot-swappable</text>
  <text class="box-sub" x="837" y="302" text-anchor="middle">skill adapters</text>

  <rect x="145" y="415" width="670" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="444" text-anchor="middle">QLoRA = 4-bit Quantized Base + LoRA Adapters → fine-tune 70B models cleanly</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
