<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How Attention Mechanism resolves word meaning">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .tok { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .wt-high { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 800; fill: #065f46; }
      .wt-low { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Attention Mechanism: Resolving Context</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Self-attention scores how strongly each word relates to every other word in the sequence.</text>

  <!-- Attention Arcs above tokens -->
  <path d="M 225 220 Q 385 115 545 220" fill="none" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
  <rect x="330" y="138" width="110" height="26" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text class="wt-high" x="385" y="156" text-anchor="middle">0.78 (High)</text>

  <path d="M 225 220 Q 495 95 765 220" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" />
  <text class="wt-low" x="625" y="148" text-anchor="middle">0.15 (Medium)</text>

  <path d="M 225 220 Q 300 185 375 220" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" />
  <text class="wt-low" x="300" y="192" text-anchor="middle">0.02</text>

  <!-- Sentence Tokens -->
  <rect x="65" y="220" width="85" height="56" rx="10" fill="#f1f5f9" class="stroke-main" />
  <text class="tok" x="107" y="254" text-anchor="middle">The</text>

  <rect x="170" y="220" width="110" height="56" rx="10" fill="#ede9fe" stroke="#6366f1" stroke-width="3" />
  <text class="tok" x="225" y="254" text-anchor="middle">bank</text>

  <rect x="300" y="220" width="150" height="56" rx="10" fill="#f1f5f9" class="stroke-main" />
  <text class="tok" x="375" y="254" text-anchor="middle">by the</text>

  <rect x="470" y="220" width="150" height="56" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="3" />
  <text class="tok" x="545" y="254" text-anchor="middle">river</text>

  <rect x="640" y="220" width="255" height="56" rx="10" fill="#dbeafe" class="stroke-main" />
  <text class="tok" x="767" y="254" text-anchor="middle">was muddy</text>

  <!-- Explanation Boxes -->
  <rect x="75" y="325" width="380" height="125" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="265" y="362" text-anchor="middle">Query, Key, Value (Q, K, V)</text>
  <text class="box-sub" x="265" y="392" text-anchor="middle">• Query ("bank"): asks "what am I near?"</text>
  <text class="box-sub" x="265" y="416" text-anchor="middle">• Key ("river"): matches strongly → high weight</text>
  <text class="box-sub" x="265" y="436" text-anchor="middle">• Value: blends river context into "bank"</text>

  <rect x="505" y="325" width="380" height="125" rx="14" fill="#d1fae5" class="stroke-main" />
  <text class="box-title" x="695" y="362" text-anchor="middle">Resulting Meaning</text>
  <text class="box-sub" x="695" y="394" text-anchor="middle">Model knows "bank" = river shore,</text>
  <text class="box-sub" x="695" y="418" text-anchor="middle">NOT a financial bank — even across</text>
  <text class="box-sub" x="695" y="438" text-anchor="middle">long paragraphs (multi-head attention)</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
