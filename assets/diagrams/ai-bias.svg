<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How AI Bias Happens">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .warn { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #991b1b; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="title" x="480" y="56" text-anchor="middle">How AI Bias Happens</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">AI acts like a mirror — unbalanced training data produces unfair outcomes.</text>
  <rect x="65" y="145" width="240" height="220" rx="16" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="185" y="190" text-anchor="middle">1. Skewed Data</text>
  <text class="box-sub" x="185" y="230" text-anchor="middle">10 years of past</text>
  <text class="box-sub" x="185" y="256" text-anchor="middle">hiring records mostly</text>
  <text class="box-sub" x="185" y="282" text-anchor="middle">from one group</text>
  <line class="arrow" x1="305" y1="255" x2="355" y2="255" />
  <polyline class="arrow" points="345,247 356,255 345,263" />
  <rect x="360" y="145" width="240" height="220" rx="16" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="480" y="190" text-anchor="middle">2. AI Learns Pattern</text>
  <text class="box-sub" x="480" y="230" text-anchor="middle">Spots the imbalance</text>
  <text class="box-sub" x="480" y="256" text-anchor="middle">and treats it as a</text>
  <text class="box-sub" x="480" y="282" text-anchor="middle">rule for "success"</text>
  <line class="arrow" x1="600" y1="255" x2="650" y2="255" />
  <polyline class="arrow" points="640,247 651,255 640,263" />
  <rect x="655" y="145" width="240" height="220" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="box-title" x="775" y="190" text-anchor="middle">3. Unfair Output</text>
  <text class="box-sub" x="775" y="230" text-anchor="middle">Down-ranks qualified</text>
  <text class="box-sub" x="775" y="256" text-anchor="middle">candidates from</text>
  <text class="box-sub" x="775" y="282" text-anchor="middle">underrepresented groups</text>
  <rect x="80" y="418" width="800" height="48" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" />
  <text class="warn" x="480" y="447" text-anchor="middle">Fix: Audit datasets for balance &amp; keep humans reviewing high-stakes decisions</text>
  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>