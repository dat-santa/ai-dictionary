<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Without vs With KV Cache</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Reusing past Key-Value tensors avoids recomputing the entire prompt per token</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">NO KV CACHE</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Recomputes Everything</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Token 100: computes tokens 1..99</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Token 101: recomputes 1..100</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Quadratic O(N²) wasted compute</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Slow decode on long prompts</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">WITH KV CACHE</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Appends Only New Step</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Stores past Keys &amp; Values in VRAM</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Token 101 computes only 1 step</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Linear O(N) decode compute</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">10x+ faster streaming generation</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">AI Dictionary — datsanta.com</text>
</svg>