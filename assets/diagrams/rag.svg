<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How RAG works">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">How RAG Works (Open-Book Exam)</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Instead of guessing from memory, AI looks up your real documents before answering.</text>

  <!-- Step 1: Question -->
  <rect x="55" y="185" width="180" height="110" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="145" y="230" text-anchor="middle">1. Question</text>
  <text class="box-sub" x="145" y="256" text-anchor="middle">"What is our</text>
  <text class="box-sub" x="145" y="274" text-anchor="middle">refund policy?"</text>

  <line class="arrow" x1="235" y1="240" x2="278" y2="240" />
  <polyline class="arrow" points="268,232 279,240 268,248" />

  <!-- Step 2: Retrieve -->
  <rect x="284" y="185" width="195" height="110" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="381" y="230" text-anchor="middle">2. Search Docs</text>
  <text class="box-sub" x="381" y="256" text-anchor="middle">Finds matching pages</text>
  <text class="box-sub" x="381" y="274" text-anchor="middle">from your files</text>

  <line class="arrow" x1="479" y1="240" x2="522" y2="240" />
  <polyline class="arrow" points="512,232 523,240 512,248" />

  <!-- Step 3: LLM -->
  <rect x="528" y="185" width="175" height="110" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="615" y="230" text-anchor="middle">3. LLM Reads</text>
  <text class="box-sub" x="615" y="256" text-anchor="middle">Question +</text>
  <text class="box-sub" x="615" y="274" text-anchor="middle">Found pages</text>

  <line class="arrow" x1="703" y1="240" x2="746" y2="240" />
  <polyline class="arrow" points="736,232 747,240 736,248" />

  <!-- Step 4: Answer -->
  <rect x="752" y="185" width="155" height="110" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="829" y="230" text-anchor="middle">4. Answer</text>
  <text class="box-sub" x="829" y="256" text-anchor="middle">Accurate &amp;</text>
  <text class="box-sub" x="829" y="274" text-anchor="middle">cites sources</text>

  <rect x="205" y="370" width="550" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="400" text-anchor="middle">RAG = Retrieval (Search) + Augmented Generation (Answer)</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
