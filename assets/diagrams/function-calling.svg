<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How Function Calling works between App and LLM">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Function Calling (Tool Use) Round-Trip</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">The LLM never runs your code directly — it returns structured JSON telling your app which function to run.</text>

  <!-- Step 1 -->
  <rect x="45" y="140" width="190" height="190" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="140" y="175" text-anchor="middle">1. Your App Sends</text>
  <text class="box-sub" x="140" y="202" text-anchor="middle">User: "Weather in Hanoi?"</text>
  <rect x="60" y="218" width="160" height="92" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <text class="mono" x="140" y="240" text-anchor="middle">tools: [{</text>
  <text class="mono" x="140" y="258" text-anchor="middle">  name: "get_weather",</text>
  <text class="mono" x="140" y="276" text-anchor="middle">  args: {city: string}</text>
  <text class="mono" x="140" y="294" text-anchor="middle">}]</text>

  <line class="arrow" x1="235" y1="235" x2="275" y2="235" />
  <polyline class="arrow" points="265,227 276,235 265,243" />

  <!-- Step 2 -->
  <rect x="280" y="140" width="195" height="190" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="377" y="175" text-anchor="middle">2. LLM Picks Tool</text>
  <text class="box-sub" x="377" y="202" text-anchor="middle">Outputs JSON call:</text>
  <rect x="295" y="220" width="165" height="86" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
  <text class="mono" x="377" y="246" text-anchor="middle">tool_call:</text>
  <text class="mono" x="377" y="266" text-anchor="middle">get_weather(</text>
  <text class="mono" x="377" y="284" text-anchor="middle">  city="Hanoi"</text>
  <text class="mono" x="377" y="298" text-anchor="middle">)</text>

  <line class="arrow" x1="475" y1="235" x2="515" y2="235" />
  <polyline class="arrow" points="505,227 516,235 505,243" />

  <!-- Step 3 -->
  <rect x="520" y="140" width="195" height="190" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="617" y="175" text-anchor="middle">3. App Runs Code</text>
  <text class="box-sub" x="617" y="202" text-anchor="middle">Executes real function</text>
  <rect x="535" y="220" width="165" height="86" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="617" y="248" text-anchor="middle">API / DB lookup</text>
  <text class="mono" x="617" y="272" text-anchor="middle">→ returns:</text>
  <text class="mono" x="617" y="292" text-anchor="middle">{"temp": "28°C"}</text>

  <line class="arrow" x1="715" y1="235" x2="755" y2="235" />
  <polyline class="arrow" points="745,227 756,235 745,243" />

  <!-- Step 4 -->
  <rect x="760" y="140" width="155" height="190" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="837" y="175" text-anchor="middle">4. Final Reply</text>
  <text class="box-sub" x="837" y="202" text-anchor="middle">LLM reads result:</text>
  <rect x="774" y="220" width="127" height="86" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text class="box-sub" x="837" y="254" text-anchor="middle">"It is currently</text>
  <text class="box-sub" x="837" y="274" text-anchor="middle">28°C in Hanoi."</text>

  <rect x="135" y="395" width="690" height="52" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="426" text-anchor="middle">Security rule: Always validate arguments &amp; user permissions in step 3 before executing</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
