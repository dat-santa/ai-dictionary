<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Cách Fine-tuning hoạt động">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">Cách Fine-tuning hoạt động</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Lấy một mô hình AI tổng quát và huấn luyện thêm để biến nó thành chuyên gia.</text>

  <rect x="70" y="170" width="230" height="130" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="185" y="218" text-anchor="middle">AI tổng quát</text>
  <text class="box-sub" x="185" y="246" text-anchor="middle">Biết một chút về nhiều</text>
  <text class="box-sub" x="185" y="266" text-anchor="middle">chủ đề phổ thông</text>

  <text x="330" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#475569">+</text>

  <rect x="360" y="170" width="240" height="130" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="480" y="218" text-anchor="middle">Ví dụ chuyên sâu</text>
  <text class="box-sub" x="480" y="246" text-anchor="middle">Hồ sơ y khoa, mẫu pháp lý,</text>
  <text class="box-sub" x="480" y="266" text-anchor="middle">hoặc giọng văn công ty bạn</text>

  <line class="arrow" x1="600" y1="235" x2="654" y2="235" />
  <polyline class="arrow" points="644,227 655,235 644,243" />

  <rect x="660" y="170" width="230" height="130" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="775" y="218" text-anchor="middle">AI chuyên gia</text>
  <text class="box-sub" x="775" y="246" text-anchor="middle">Giữ đúng giọng điệu,</text>
  <text class="box-sub" x="775" y="266" text-anchor="middle">định dạng &amp; luật chuyên ngành</text>

  <rect x="190" y="370" width="580" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="400" text-anchor="middle">Giống như bác sĩ đa khoa đi học chuyên sâu một chuyên khoa riêng</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
