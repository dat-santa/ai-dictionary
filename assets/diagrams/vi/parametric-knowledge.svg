  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Nén sẵn trong mạng nơ-ron</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Học được trong lúc huấn luyện</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Đóng băng tại mốc knowledge cutoff</text>
