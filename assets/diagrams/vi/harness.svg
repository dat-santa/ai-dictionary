  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Tự nén ngữ cảnh &amp; chạy vòng lặp agent</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Trực tiếp sửa code &amp; chạy unit test</text>

