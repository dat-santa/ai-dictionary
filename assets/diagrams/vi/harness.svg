  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Cùng một Model, Khác Harness</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Model chỉ nhận chữ và trả chữ — chính Harness biến nó thành app chat hay coding agent</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">CHAT HARNESS</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">vd: Claude.ai / ChatGPT</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">System prompt tối ưu cho hỏi đáp</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Công cụ tìm web &amp; đọc file tải lên</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Lưu lịch sử chat &amp; xem trước nhanh</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Không chạm vào ổ đĩa hay terminal</text>

  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">CODING HARNESS</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">vd: Claude Code / Cursor</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
