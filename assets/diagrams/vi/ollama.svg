<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Chạy Model trên máy với Ollama</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Trải nghiệm đơn giản như Docker để tải và mở API cho model mở ngay tại máy</text>

  <rect x="64" y="140" width="256" height="280" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="136" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="192" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">1. TẢI MODEL</text>
  <text x="192" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">ollama run llama3.2</text>
  <line x1="92" y1="246" x2="292" y2="246" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="192" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Tự tải gói GGUF một lần duy nhất</text>
  <text x="192" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Tự nhận diện GPU / Apple Silicon</text>
  <text x="192" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Không cần tự biên dịch C++ phức tạp</text>
  <line x1="326" y1="280" x2="340" y2="280" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="346,280 336,274 336,286" fill="#64748b"/>
  <rect x="352" y="140" width="256" height="280" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="424" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">2. MỞ API LOCAL</text>
  <text x="480" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">localhost:11434</text>
  <line x1="380" y1="246" x2="580" y2="246" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="480" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Giữ sẵn model nóng trong RAM/VRAM</text>
  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Mở API chuẩn tương thích OpenAI</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Hỗ trợ gọi hàm &amp; xuất JSON chuẩn</text>
  <line x1="614" y1="280" x2="628" y2="280" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="634,280 624,274 624,286" fill="#64748b"/>
  <rect x="640" y="140" width="256" height="280" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="712" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="768" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">3. PHÁT TRIỂN $0</text>
  <text x="768" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Riêng tư &amp; Offline</text>
  <line x1="668" y1="246" x2="868" y2="246" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="768" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Không tốn tiền API khi lập trình</text>
  <text x="768" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Dữ liệu không rời khỏi laptop</text>
  <text x="768" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Lên production chỉ cần đổi URL API</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
</svg>