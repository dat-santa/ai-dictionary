<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="LLM nhanh thường vs. Reasoning Model">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .warn { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #991b1b; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="title" x="480" y="56" text-anchor="middle">LLM nhanh thường vs. Reasoning Model</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">Reasoning model dừng lại suy luận từng bước và tự kiểm tra trước khi trả lời.</text>
  <rect x="60" y="130" width="390" height="255" rx="16" fill="#fef3c7" class="stroke-main" />
  <text class="card-title" x="255" y="172" text-anchor="middle">LLM nhanh thông thường</text>
  <text class="box-sub" x="255" y="214" text-anchor="middle">• Trả lời tức thì (&lt; 1 giây)</text>
  <text class="box-sub" x="255" y="244" text-anchor="middle">• Rất hợp viết email &amp; tóm tắt</text>
  <text class="box-sub" x="255" y="274" text-anchor="middle">• Chi phí rẻ mỗi lần gọi</text>
  <text class="box-sub" x="255" y="304" text-anchor="middle">• Dễ vấp ở bài toán logic nhiều bước</text>
  <rect x="510" y="130" width="390" height="255" rx="16" fill="#ede9fe" class="stroke-main" />
  <text class="card-title" x="705" y="172" text-anchor="middle">Reasoning Model (Suy luận)</text>
  <text class="box-sub" x="705" y="214" text-anchor="middle">• Dừng vài giây suy nghĩ &amp; rà lỗi</text>
  <text class="box-sub" x="705" y="244" text-anchor="middle">• Thử nhiều hướng trước khi chốt</text>
  <text class="box-sub" x="705" y="274" text-anchor="middle">• Chậm và tốn chi phí hơn chút</text>
  <text class="box-sub" x="705" y="304" text-anchor="middle">• Vượt trội ở toán, code &amp; lập kế hoạch</text>
  <text x="480" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#475569">vs.</text>
  <rect x="80" y="418" width="800" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="447" text-anchor="middle">Dùng model nhanh cho việc hằng ngày; để dành reasoning model cho bài toán khó</text>
  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>