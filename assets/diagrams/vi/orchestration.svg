<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Điều phối hệ thống AI Orchestration">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Orchestration: Điều phối chuỗi bước AI ổn định</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Code kiểm soát luồng đi, chạy song song, retry, trạng thái và dự phòng quanh các bước gọi LLM.</text>

  <rect x="45" y="195" width="165" height="115" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="127" y="236" text-anchor="middle">1. Bộ định tuyến</text>
  <text class="box-sub" x="127" y="262" text-anchor="middle">Phân loại ý định &amp;</text>
  <text class="box-sub" x="127" y="280" text-anchor="middle">chọn đúng nhánh</text>

  <line class="arrow" x1="210" y1="230" x2="275" y2="170" />
  <line class="arrow" x1="210" y1="252" x2="275" y2="252" />
  <line class="arrow" x1="210" y1="274" x2="275" y2="334" />

  <rect x="280" y="130" width="210" height="72" rx="12" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="385" y="160" text-anchor="middle">Nhánh A: Tìm RAG</text>
  <text class="box-sub" x="385" y="182" text-anchor="middle">Timeout: 3s | Retry: 2 lần</text>

  <rect x="280" y="216" width="210" height="72" rx="12" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="385" y="246" text-anchor="middle">Nhánh B: Truy vấn SQL</text>
  <text class="box-sub" x="385" y="268" text-anchor="middle">Chạy song song cùng lúc</text>

  <rect x="280" y="302" width="210" height="72" rx="12" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="385" y="332" text-anchor="middle">Mô hình dự phòng</text>
  <text class="box-sub" x="385" y="354" text-anchor="middle">Chuyển khi model chính 429/500</text>

  <line class="arrow" x1="490" y1="166" x2="555" y2="232" />
  <line class="arrow" x1="490" y1="252" x2="555" y2="252" />
  <line class="arrow" x1="490" y1="338" x2="555" y2="272" />

  <rect x="560" y="175" width="175" height="150" rx="14" fill="#f1f5f9" class="stroke-main" />
  <text class="box-title" x="647" y="218" text-anchor="middle">2. Lưu State</text>
  <text class="box-sub" x="647" y="248" text-anchor="middle">Lưu checkpoint tiến độ,</text>
  <text class="box-sub" x="647" y="268" text-anchor="middle">kiểm tra schema &amp;</text>
  <text class="box-sub" x="647" y="288" text-anchor="middle">ghi log độ trễ</text>

  <line class="arrow" x1="735" y1="250" x2="770" y2="250" />
  <polyline class="arrow" points="760,242 771,250 760,258" />

  <rect x="775" y="195" width="140" height="115" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="845" y="236" text-anchor="middle">3. Đầu ra</text>
  <text class="box-sub" x="845" y="264" text-anchor="middle">Kết quả cuối</text>
  <text class="box-sub" x="845" y="282" text-anchor="middle">ổn định, tin cậy</text>

  <rect x="145" y="405" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Nguyên tắc: Đừng ép 1 prompt khổng lồ làm hết — hãy tách thành từng bước có điều phối</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
