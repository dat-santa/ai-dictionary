<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Mốc thời gian Knowledge Cutoff">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .warn { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #991b1b; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="title" x="480" y="56" text-anchor="middle">Mốc thời gian Knowledge Cutoff</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">Trí nhớ cài sẵn của mô hình dừng lại đúng ngày dữ liệu huấn luyện kết thúc.</text>
  <rect x="65" y="145" width="240" height="220" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="185" y="190" text-anchor="middle">Trước mốc Cutoff</text>
  <text class="box-sub" x="185" y="230" text-anchor="middle">Lịch sử, khoa học,</text>
  <text class="box-sub" x="185" y="256" text-anchor="middle">lập trình và sự kiện</text>
  <text class="box-sub" x="185" y="282" text-anchor="middle">AI đã học rất kỹ ✓</text>
  <line class="arrow" x1="305" y1="255" x2="355" y2="255" />
  <polyline class="arrow" points="345,247 356,255 345,263" />
  <rect x="360" y="145" width="240" height="220" rx="16" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="480" y="190" text-anchor="middle">Ngày Cutoff</text>
  <text class="box-sub" x="480" y="230" text-anchor="middle">Dữ liệu học dừng lại</text>
  <text class="box-sub" x="480" y="256" text-anchor="middle">(vd: Tháng 3/2025)</text>
  <text class="box-sub" x="480" y="282" text-anchor="middle">Trí nhớ đóng băng</text>
  <line class="arrow" x1="600" y1="255" x2="650" y2="255" />
  <polyline class="arrow" points="640,247 651,255 640,263" />
  <rect x="655" y="145" width="240" height="220" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="box-title" x="775" y="190" text-anchor="middle">Sau mốc Cutoff</text>
  <text class="box-sub" x="775" y="230" text-anchor="middle">Tin hôm nay, giá mới,</text>
  <text class="box-sub" x="775" y="256" text-anchor="middle">luật mới — bắt buộc</text>
  <text class="box-sub" x="775" y="282" text-anchor="middle">dùng Tìm web / RAG</text>
  <rect x="80" y="418" width="800" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="447" text-anchor="middle">Với tin tức mới hoặc tài liệu nội bộ, hãy kết hợp AI với Tìm kiếm web hoặc RAG</text>
  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
