  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Chặn đứng ngay tại cửa vào</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">LLM chính 70B không bao giờ thấy</text>
  <line x1="614" y1="280" x2="628" y2="280" stroke="#64748b" stroke-width="2.5"/>
