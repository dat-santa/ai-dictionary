<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Môi trường cách ly Sandbox chạy code AI">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Sandbox: Hộp cát chạy code AI an toàn</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Chạy code do AI viết bên trong container dùng một lần với giới hạn chặt về CPU, mạng và ổ cứng.</text>

  <rect x="45" y="155" width="215" height="175" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="152" y="190" text-anchor="middle">Code do AI sinh ra</text>
  <rect x="62" y="208" width="181" height="96" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" />
  <text class="mono" x="152" y="234" text-anchor="middle">import pandas as pd</text>
  <text class="mono" x="152" y="256" text-anchor="middle">df.groupby(...)</text>
  <text class="box-sub" x="152" y="286" text-anchor="middle" fill="#991b1b">(Có thể lỗi hoặc nguy hiểm!)</text>

  <line class="arrow" x1="260" y1="242" x2="305" y2="242" />
  <polyline class="arrow" points="295,234 306,242 295,250" />

  <rect x="310" y="125" width="360" height="240" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 4" />
  <text class="box-title" x="490" y="160" text-anchor="middle">Sandbox cách ly (Container / MicroVM)</text>

  <rect x="335" y="182" width="310" height="72" rx="10" fill="#ffffff" class="stroke-main" />
  <text class="box-sub" x="490" y="208" text-anchor="middle" font-weight="700">✓ Chạy trong thư mục tạm dùng 1 lần</text>
  <text class="box-sub" x="490" y="232" text-anchor="middle">✓ Khóa trần RAM, CPU &amp; timeout 10 giây</text>

  <rect x="335" y="268" width="310" height="72" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" />
  <text class="box-sub" x="490" y="295" text-anchor="middle" font-weight="700" fill="#991b1b">✗ Cấm đụng file máy chủ &amp; biến mật .env</text>
  <text class="box-sub" x="490" y="319" text-anchor="middle" fill="#991b1b">✗ Tắt mạng ra ngoài (hoặc chỉ mở domain duyệt)</text>

  <line class="arrow" x1="670" y1="242" x2="715" y2="242" />
  <polyline class="arrow" points="705,234 716,242 705,250" />

  <rect x="720" y="155" width="195" height="175" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="817" y="195" text-anchor="middle">Kết quả an toàn</text>
  <text class="box-sub" x="817" y="228" text-anchor="middle">Trả về stdout, biểu đồ,</text>
  <text class="box-sub" x="817" y="248" text-anchor="middle">hoặc thông báo lỗi gọn</text>
  <text class="box-sub" x="817" y="286" text-anchor="middle" font-weight="700">Tự hủy sau khi chạy</text>

  <rect x="145" y="405" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Tuyệt đối không dùng eval() hay exec() chạy code LLM trực tiếp trên server chính</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
