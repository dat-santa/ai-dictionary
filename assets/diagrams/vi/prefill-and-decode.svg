<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Pha Prefill và Pha Decode</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Quá trình chạy LLM chia làm hai pha: đọc prompt song song và sinh chữ tuần tự</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PHA 1: PREFILL</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Xử lý toàn bộ Prompt</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Đọc mọi token đầu vào song song</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Nghẽn ở năng lực tính toán (Compute)</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Tạo bộ nhớ đệm KV Cache ban đầu</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Quyết định thời gian chờ TTFT</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">PHA 2: DECODE</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Sinh từng Token trả lời</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Mỗi bước chỉ sinh đúng 1 token</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Nghẽn ở băng thông bộ nhớ (VRAM)</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Đọc lại trọng số model mỗi bước</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Quyết định tốc độ chạy chữ TPS</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
</svg>