<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Đo lường AI ROI: Giá trị và Tổng chi phí">
  <defs>
    <style>
      .bg { fill: #ffffff; }
