<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Quy trình kiểm thử tự động Evals cho LLM">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Evals: Unit Test cho hệ thống AI</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Đo chất lượng trên 100+ tình huống mẫu để sửa prompt hay đổi model không làm hỏng production.</text>

  <rect x="45" y="150" width="190" height="185" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="140" y="185" text-anchor="middle">1. Bộ dữ liệu Eval</text>
  <text class="box-sub" x="140" y="214" text-anchor="middle">100 câu hỏi thật</text>
  <text class="box-sub" x="140" y="234" text-anchor="middle">+ ca khó (edge cases)</text>
  <text class="box-sub" x="140" y="254" text-anchor="middle">+ đáp án kỳ vọng</text>
  <rect x="65" y="274" width="150" height="42" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <text class="mono" x="140" y="300" text-anchor="middle">cases.jsonl (100)</text>

  <line class="arrow" x1="235" y1="242" x2="275" y2="242" />
  <polyline class="arrow" points="265,234 276,242 265,250" />

  <rect x="280" y="150" width="185" height="185" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="372" y="185" text-anchor="middle">2. Chạy thử bản mới</text>
  <text class="box-sub" x="372" y="216" text-anchor="middle">Test Prompt v2 mới,</text>
  <text class="box-sub" x="372" y="236" text-anchor="middle">luồng RAG mới, hoặc</text>
  <text class="box-sub" x="372" y="256" text-anchor="middle">model rẻ hơn</text>
  <text class="mono" x="372" y="298" text-anchor="middle">Sinh 100 câu trả lời</text>

  <line class="arrow" x1="465" y1="242" x2="505" y2="242" />
  <polyline class="arrow" points="495,234 506,242 495,250" />

  <rect x="510" y="150" width="195" height="185" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="607" y="185" text-anchor="middle">3. Bộ chấm tự động</text>
  <rect x="528" y="206" width="159" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="box-sub" x="607" y="228" text-anchor="middle" font-weight="700">Kiểm tra bằng Code</text>
  <text class="box-sub" x="607" y="246" text-anchor="middle">JSON chuẩn, đúng ID</text>
  <rect x="528" y="266" width="159" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="box-sub" x="607" y="288" text-anchor="middle" font-weight="700">LLM Judge / Người</text>
  <text class="box-sub" x="607" y="306" text-anchor="middle">Giọng văn &amp; độ chuẩn</text>

  <line class="arrow" x1="705" y1="242" x2="745" y2="242" />
  <polyline class="arrow" points="735,234 746,242 735,250" />

  <rect x="750" y="150" width="165" height="185" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="832" y="185" text-anchor="middle">4. Bảng điểm</text>
  <text class="box-sub" x="832" y="222" text-anchor="middle">Bản cũ v1: 84%</text>
  <text class="mono" x="832" y="252" text-anchor="middle" fill="#065f46">Bản mới v2: 92%</text>
  <rect x="772" y="274" width="120" height="40" rx="10" fill="#10b981" />
  <text x="832" y="299" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">ĐẠT → Deploy!</text>

  <rect x="145" y="405" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Đừng test mò 3 câu bằng mắt — hãy chạy Evals trong CI trước mỗi lần sửa prompt/model</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
