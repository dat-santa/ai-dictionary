<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">RLHF (PPO) và DPO</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">DPO căn chỉnh sở thích model trực tiếp từ cặp chọn/loại mà không cần reward model</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">RLHF TRUYỀN THỐNG (PPO)</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Quy trình 4 model phức tạp</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Phải train thêm Reward Model riêng</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Nạp tới 4 model cùng lúc khi train</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Rất nhạy tham số, dễ mất ổn định</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Khó debug và tốn nhiều VRAM</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">DPO</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Tối ưu trực tiếp theo cặp mẫu</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Chỉ cần bộ (câu hỏi, mẫu tốt, mẫu xấu)</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Không cần dựng reward model riêng</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Hàm mất mát đơn giản, dễ chạy</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Ổn định, nhanh và rất phổ biến</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
</svg>