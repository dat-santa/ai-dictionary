<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Lan truyền ngược thường và Gradient Checkpointing</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Đánh đổi ~25% thời gian tính để giảm mạnh VRAM, tránh tràn bộ nhớ khi train</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">TRAIN MẶC ĐỊNH</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Giữ hết giá trị mọi lớp ở VRAM</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Lưu toàn bộ kích hoạt trung gian</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Tốc độ lan truyền ngược nhanh nhất</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Dễ sập vì tràn VRAM (OOM) khi dài</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Bị giới hạn batch size nhỏ</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">GRADIENT CHECKPOINTING</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Chỉ lưu mốc, tính lại đoạn giữa</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Chỉ giữ các điểm kiểm tra chính</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Tính lại lớp trung gian khi cần</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Giảm mạnh lượng VRAM tiêu thụ</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Chậm hơn ~25% nhưng không tràn bộ nhớ</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
