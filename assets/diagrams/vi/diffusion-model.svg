<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Cách Diffusion Model tạo ra hình ảnh">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .warn { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #991b1b; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="title" x="480" y="56" text-anchor="middle">Cách Diffusion Model tạo ra hình ảnh</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">Bắt đầu từ nhiễu hạt ngẫu nhiên rồi khử nhiễu dần từng bước theo mô tả của bạn.</text>
  <rect x="55" y="155" width="190" height="205" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="150" y="198" text-anchor="middle">1. Nhiễu hoàn toàn</text>
  <text class="box-sub" x="150" y="236" text-anchor="middle">Các hạt màu</text>
  <text class="box-sub" x="150" y="261" text-anchor="middle">ngẫu nhiên</text>
  <text class="box-sub" x="150" y="286" text-anchor="middle">(Bước 0)</text>
  <line class="arrow" x1="245" y1="257" x2="271" y2="257" />
  <polyline class="arrow" points="263,250 272,257 263,264" />
  <rect x="275" y="155" width="190" height="205" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="370" y="198" text-anchor="middle">2. Hiện dáng thô</text>
  <text class="box-sub" x="370" y="236" text-anchor="middle">Lờ mờ hình khối</text>
  <text class="box-sub" x="370" y="261" text-anchor="middle">chú mèo hiện ra</text>
  <text class="box-sub" x="370" y="286" text-anchor="middle">(Bước 10)</text>
  <line class="arrow" x1="465" y1="257" x2="491" y2="257" />
  <polyline class="arrow" points="483,250 492,257 483,264" />
  <rect x="495" y="155" width="190" height="205" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="590" y="198" text-anchor="middle">3. Rõ chi tiết</text>
  <text class="box-sub" x="590" y="236" text-anchor="middle">Lông, kính râm</text>
  <text class="box-sub" x="590" y="261" text-anchor="middle">và ánh sáng nét dần</text>
  <text class="box-sub" x="590" y="286" text-anchor="middle">(Bước 25)</text>
  <line class="arrow" x1="685" y1="257" x2="711" y2="257" />
  <polyline class="arrow" points="703,250 712,257 703,264" />
  <rect x="715" y="155" width="190" height="205" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="810" y="198" text-anchor="middle">4. Ảnh hoàn chỉnh</text>
  <text class="box-sub" x="810" y="236" text-anchor="middle">Bức ảnh mới</text>
  <text class="box-sub" x="810" y="261" text-anchor="middle">sắc nét sẵn sàng</text>
  <text class="box-sub" x="810" y="286" text-anchor="middle">(Bước 40)</text>
  <rect x="80" y="418" width="800" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="447" text-anchor="middle">Giống như lau dần hơi nước trên gương mờ cho tới khi ảnh sắc nét hiện ra</text>
  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>