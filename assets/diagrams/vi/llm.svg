<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Cách LLM hoạt động">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">Cách LLM hoạt động</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">LLM đọc hàng tỷ văn bản, rồi đoán từ tiếp theo hợp lý nhất — từng từ một.</text>

  <rect x="65" y="160" width="235" height="125" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="182" y="204" text-anchor="middle">Prompt của bạn</text>
  <text class="box-sub" x="182" y="236" text-anchor="middle">"Bầu trời hôm nay..."</text>

  <line class="arrow" x1="300" y1="222" x2="360" y2="222" />
  <polyline class="arrow" points="350,214 361,222 350,230" />

  <rect x="366" y="160" width="228" height="125" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="480" y="204" text-anchor="middle">LLM</text>
  <text class="box-sub" x="480" y="232" text-anchor="middle">Đối chiếu mẫu câu từ</text>
  <text class="box-sub" x="480" y="254" text-anchor="middle">kho dữ liệu khổng lồ</text>

  <line class="arrow" x1="594" y1="222" x2="654" y2="222" />
  <polyline class="arrow" points="644,214 655,222 644,230" />

  <rect x="660" y="160" width="235" height="125" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="777" y="204" text-anchor="middle">Từ tiếp theo</text>
  <text class="mono" x="777" y="238" text-anchor="middle">"xanh ngắt" (82%)</text>
  <text class="box-sub" x="777" y="262" text-anchor="middle">"nhiều mây" (12%)</text>

  <rect x="190" y="348" width="580" height="62" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8" />
  <text x="480" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Lặp lại cách đoán này từng chữ để viết thành cả đoạn văn</text>
  <text class="box-sub" x="480" y="398" text-anchor="middle">Ví dụ: ChatGPT, Claude, Gemini</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
