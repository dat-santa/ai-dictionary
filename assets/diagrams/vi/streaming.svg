<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="So sánh HTTP chờ toàn bộ và Streaming SSE">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Trả về một lần vs. Streaming (SSE)</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Streaming gửi từng token ngay khi sinh ra, giúp người dùng không phải nhìn màn hình trắng.</text>

  <text class="label" x="65" y="142">1. HTTP chặn chờ thông thường (stream: false)</text>
  <rect x="65" y="158" width="640" height="70" rx="12" fill="#fee2e2" class="stroke-main" />
  <text class="label" x="385" y="190" text-anchor="middle" fill="#991b1b">⏳ Màn hình trắng / Vòng xoay chờ 5.0 giây...</text>
  <text class="box-sub" x="385" y="212" text-anchor="middle">User chờ trong lúc server sinh đủ cả 200 token</text>

  <rect x="720" y="158" width="180" height="70" rx="12" fill="#f1f5f9" class="stroke-main" />
  <text class="label" x="810" y="190" text-anchor="middle">Toàn bộ chữ</text>
  <text class="box-sub" x="810" y="212" text-anchor="middle">Tới nơi ở giây 5.0</text>

  <text class="label" x="65" y="278">2. Streaming qua Server-Sent Events (stream: true)</text>
  <rect x="65" y="294" width="115" height="72" rx="12" fill="#fef3c7" class="stroke-main" />
  <text class="label" x="122" y="326" text-anchor="middle">0.4 giây</text>
  <text class="box-sub" x="122" y="348" text-anchor="middle">TTFT</text>

  <rect x="195" y="294" width="155" height="72" rx="12" fill="#dcfce7" class="stroke-main" />
  <text class="mono" x="272" y="324" text-anchor="middle">data: "Đây"</text>
  <text class="box-sub" x="272" y="348" text-anchor="middle">Hiện mảnh 1</text>

  <rect x="365" y="294" width="155" height="72" rx="12" fill="#dcfce7" class="stroke-main" />
  <text class="mono" x="442" y="324" text-anchor="middle">data: " là"</text>
  <text class="box-sub" x="442" y="348" text-anchor="middle">Hiện mảnh 2</text>

  <rect x="535" y="294" width="155" height="72" rx="12" fill="#dcfce7" class="stroke-main" />
  <text class="mono" x="612" y="324" text-anchor="middle">data: " kết"</text>
  <text class="box-sub" x="612" y="348" text-anchor="middle">Hiện mảnh 3</text>

  <rect x="705" y="294" width="195" height="72" rx="12" fill="#d1fae5" class="stroke-main" />
  <text class="mono" x="802" y="324" text-anchor="middle">data: [DONE]</text>
  <text class="box-sub" x="802" y="348" text-anchor="middle">Đóng luồng ở giây 5.0</text>

  <rect x="145" y="410" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="440" text-anchor="middle">Tổng thời gian vẫn là 5.0s, nhưng user đọc được từ giây 0.4 — cảm giác nhanh gấp 10×</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
