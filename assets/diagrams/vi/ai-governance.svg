<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="3 trụ cột của AI Governance">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">AI Governance (Quản trị AI) đơn giản</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Quy tắc rõ ràng giúp đội ngũ dùng AI an toàn mà không làm chậm tiến độ.</text>

  <rect x="65" y="155" width="255" height="175" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="192" y="200" text-anchor="middle">1. Công cụ được duyệt</text>
  <text class="box-sub" x="192" y="236" text-anchor="middle">App AI nào được phép</text>
  <text class="box-sub" x="192" y="258" text-anchor="middle">dùng trong công ty</text>
  <text class="box-sub" x="192" y="280" text-anchor="middle">&amp; ai chi trả tài khoản</text>

  <rect x="352" y="155" width="255" height="175" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="480" y="200" text-anchor="middle">2. Luật dữ liệu</text>
  <text class="box-sub" x="480" y="236" text-anchor="middle">Thông tin nào được đưa</text>
  <text class="box-sub" x="480" y="258" text-anchor="middle">vào &amp; thứ gì cấm dán</text>
  <text class="box-sub" x="480" y="280" text-anchor="middle">(lương, CCCD khách)</text>

  <rect x="640" y="155" width="255" height="175" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="767" y="200" text-anchor="middle">3. Trách nhiệm</text>
  <text class="box-sub" x="767" y="236" text-anchor="middle">Ai kiểm duyệt đầu ra</text>
  <text class="box-sub" x="767" y="258" text-anchor="middle">&amp; ai chịu trách nhiệm</text>
  <text class="box-sub" x="767" y="280" text-anchor="middle">khi AI làm sai</text>

  <rect x="195" y="385" width="570" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="415" text-anchor="middle">Quản trị tốt = Đèn giao thông giúp mọi người đi nhanh mà an toàn</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
