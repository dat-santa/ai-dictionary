<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Định tuyến Model (Model Routing)</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Phân loại độ khó yêu cầu để dùng model rẻ cho việc dễ và model mạnh cho việc khó</text>

  <rect x="64" y="140" width="256" height="280" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="136" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="192" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">YÊU CẦU ĐẾN</text>
  <text x="192" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Chấm điểm trong ~10 ms</text>
  <line x1="92" y1="246" x2="292" y2="246" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="192" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Bộ phân loại xem độ phức tạp</text>
  <text x="192" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Hỏi đáp dễ vs sửa code nhiều file</text>
  <text x="192" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Quyết định *trước khi* gọi LLM</text>
  <line x1="326" y1="280" x2="340" y2="280" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="346,280 336,274 336,286" fill="#64748b"/>
  <rect x="352" y="140" width="256" height="280" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="424" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="480" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">VIỆC DỄ (75% LƯỢT)</text>
  <text x="480" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Model nhỏ 8B siêu nhanh</text>
  <line x1="380" y1="246" x2="580" y2="246" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="480" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Gắn nhãn, tóm tắt, phân loại</text>
  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Phản hồi dưới 1 giây</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Chi phí cực rẻ (~$0.05 / 1M token)</text>
  <line x1="614" y1="280" x2="628" y2="280" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="634,280 624,274 624,286" fill="#64748b"/>
  <rect x="640" y="140" width="256" height="280" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="712" y="160" width="112" height="26" rx="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="768" y="177" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">VIỆC KHÓ (25% LƯỢT)</text>
  <text x="768" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">LLM đầu bảng mạnh nhất</text>
  <line x1="668" y1="246" x2="868" y2="246" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="768" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Suy luận sâu &amp; viết code phức tạp</text>
  <text x="768" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Giữ nguyên chất lượng đỉnh cao</text>
  <text x="768" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">Tiết kiệm 60–80% tổng hóa đơn</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
</svg>