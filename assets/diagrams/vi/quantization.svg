<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Lượng tử hóa mô hình từ FP16 xuống INT4">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Quantization: Nén nhẹ trọng số mô hình</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Ví dụ mô hình 7B: Nén trọng số từ số thực 16-bit xuống số nguyên 4-bit giúp giảm 75% VRAM.</text>

  <rect x="65" y="135" width="245" height="235" rx="16" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="187" y="175" text-anchor="middle">FP16 (16-bit)</text>
  <text class="box-sub" x="187" y="198" text-anchor="middle">Độ chính xác đầy đủ</text>
  <rect x="85" y="220" width="205" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
  <text class="mono" x="187" y="247" text-anchor="middle">w = 0.38492017</text>
  <text class="box-sub" x="187" y="295" text-anchor="middle" font-weight="700">VRAM cần: ~14 GB</text>
  <text class="box-sub" x="187" y="318" text-anchor="middle">Cần GPU máy chủ</text>
  <text class="box-sub" x="187" y="340" text-anchor="middle">(vd: A10G / RTX 4090)</text>

  <line class="arrow" x1="310" y1="252" x2="352" y2="252" />
  <polyline class="arrow" points="342,244 353,252 342,260" />

  <rect x="357" y="135" width="245" height="235" rx="16" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="480" y="175" text-anchor="middle">INT8 (8-bit)</text>
  <text class="box-sub" x="480" y="198" text-anchor="middle">Nhẹ hơn 2 lần</text>
  <rect x="377" y="220" width="205" height="44" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="480" y="247" text-anchor="middle">w = 49  (× hệ số)</text>
  <text class="box-sub" x="480" y="295" text-anchor="middle" font-weight="700">VRAM cần: ~7 GB</text>
  <text class="box-sub" x="480" y="318" text-anchor="middle">Gần như không mất chất lượng</text>
  <text class="box-sub" x="480" y="340" text-anchor="middle">Chạy nhanh hơn rõ rệt</text>

  <line class="arrow" x1="602" y1="252" x2="644" y2="252" />
  <polyline class="arrow" points="634,244 645,252 634,260" />

  <rect x="650" y="135" width="245" height="235" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="772" y="175" text-anchor="middle">INT4 / Q4 (4-bit)</text>
  <text class="box-sub" x="772" y="198" text-anchor="middle">Nhẹ hơn ~4 lần</text>
  <rect x="670" y="220" width="205" height="44" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text class="mono" x="772" y="247" text-anchor="middle">w = 3   (× hệ số)</text>
  <text class="box-sub" x="772" y="295" text-anchor="middle" font-weight="700">VRAM cần: ~4 GB</text>
  <text class="box-sub" x="772" y="318" text-anchor="middle">Chạy mượt trên laptop thường</text>
  <text class="box-sub" x="772" y="340" text-anchor="middle">Định dạng: GGUF, AWQ</text>

  <rect x="145" y="405" width="670" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Đánh đổi: Giảm nhẹ độ chi tiết để đổi lấy dung lượng nhỏ hơn 3–4× và tốc độ nhanh hơn</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
