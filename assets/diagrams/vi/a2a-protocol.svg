<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Giao thức MCP và A2A</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">MCP nối một agent với công cụ; A2A kết nối các agent độc lập phối hợp với nhau</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">MCP (AGENT -&gt; CÔNG CỤ)</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Kết nối dọc tới dữ liệu &amp; API</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Nối 1 agent với DB, file, API</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Cung cấp tools, resources, prompts</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Chuẩn hóa &#x27;tay chân&#x27; cho agent</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Ví dụ: Agent truy vấn Postgres</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">A2A (AGENT &lt;-&gt; AGENT)</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Phối hợp ngang giữa các Agent</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Nối các agent độc lập khác hãng</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Agent Card công bố năng lực</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Ủy quyền tác vụ chạy nhiều bước</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Ví dụ: Agent du lịch đặt vé qua hãng bay</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
</svg>