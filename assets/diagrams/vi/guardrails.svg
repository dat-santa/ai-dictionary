<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Hàng rào bảo vệ AI Guardrails">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">Guardrails (Hàng rào bảo vệ AI)</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Bộ lọc an toàn giữ cho AI của công ty luôn lịch sự, đúng chủ đề và đúng chính sách.</text>

  <rect x="65" y="185" width="185" height="110" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="157" y="230" text-anchor="middle">Tin nhắn khách</text>
  <text class="box-sub" x="157" y="258" text-anchor="middle">Hỏi về giá bán,</text>
  <text class="box-sub" x="157" y="276" text-anchor="middle">hoặc hỏi lạc đề</text>

  <line class="arrow" x1="250" y1="240" x2="298" y2="240" />
  <polyline class="arrow" points="288,232 299,240 288,248" />

  <rect x="304" y="185" width="165" height="110" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="386" y="230" text-anchor="middle">Mô hình AI</text>
  <text class="box-sub" x="386" y="258" text-anchor="middle">Tạo câu trả lời</text>
  <text class="box-sub" x="386" y="276" text-anchor="middle">nháp</text>

  <line class="arrow" x1="469" y1="240" x2="517" y2="240" />
  <polyline class="arrow" points="507,232 518,240 507,248" />

  <rect x="523" y="165" width="195" height="150" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="620" y="205" text-anchor="middle">Guardrails</text>
  <text class="box-sub" x="620" y="236" text-anchor="middle">• Chặn hứa giảm giá ảo</text>
  <text class="box-sub" x="620" y="258" text-anchor="middle">• Che thông tin mật</text>
  <text class="box-sub" x="620" y="280" text-anchor="middle">• Giữ đúng giọng thương hiệu</text>

  <line class="arrow" x1="718" y1="240" x2="766" y2="240" />
  <polyline class="arrow" points="756,232 767,240 756,248" />

  <rect x="772" y="185" width="130" height="110" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="837" y="230" text-anchor="middle">An toàn</text>
  <text class="box-sub" x="837" y="258" text-anchor="middle">Đúng chuẩn &amp;</text>
  <text class="box-sub" x="837" y="276" text-anchor="middle">đúng quy định</text>

  <rect x="210" y="375" width="540" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="405" text-anchor="middle">Giống lan can đường đèo: giữ AI luôn chạy trong làn an toàn</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
