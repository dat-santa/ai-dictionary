  <text x="268" y="254" text-anchor="middle" font-size="14" fill="#1e293b">Chờ ít nhất, chi phí token thấp nhất</text>

  <rect x="496" y="134" width="392" height="148" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="692" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">MEDIUM — Mặc định hằng ngày</text>
