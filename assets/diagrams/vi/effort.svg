  <line x1="104" y1="368" x2="432" y2="368" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="268" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Bug khó, quyết định kiến trúc, kế hoạch</text>
