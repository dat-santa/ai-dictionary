  <text x="692" y="228" text-anchor="middle" font-size="14" fill="#1e293b">Lập trình thường ngày &amp; viết tính năng</text>
  <text x="692" y="254" text-anchor="middle" font-size="14" fill="#1e293b">Cân bằng tốt tốc độ, độ chuẩn &amp; giá</text>

  <rect x="72" y="306" width="392" height="148" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
