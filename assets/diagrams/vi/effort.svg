  <rect x="496" y="306" width="392" height="148" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="692" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">MAX — Bài toán hóc búa nhất</text>
