  <text x="768" y="224" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Kiểm soát tốt trên Production</text>
  <line x1="668" y1="246" x2="868" y2="246" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="768" y="284" text-anchor="middle" font-size="14" fill="#1e293b">Không bao giờ lặp vô hạn đốt tiền</text>
  <text x="768" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Dễ viết unit test cho từng nút</text>
  <text x="768" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Theo dõi và gỡ lỗi trực quan</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">Từ điển AI — datsanta.com</text>
