<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="So sánh Zero-shot và Few-shot Prompting">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Zero-shot vs. Few-shot Prompting</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Đưa 2–5 cặp ví dụ mẫu ngay trong prompt để khóa chặt giọng văn và định dạng đầu ra.</text>

  <rect x="55" y="118" width="405" height="275" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="card-title" x="257" y="152" text-anchor="middle">Zero-shot (0 ví dụ mẫu)</text>
  <rect x="75" y="172" width="365" height="72" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
  <text class="mono" x="90" y="198">Prompt:</text>
  <text class="mono" x="90" y="220">"Phân loại lỗi: App sập khi đăng nhập"</text>

  <rect x="75" y="260" width="365" height="110" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" />
  <text class="mono" x="90" y="286" font-weight="700">Đầu ra (Khó lường):</text>
  <text class="box-sub" x="90" y="310">"Đây có vẻ là lỗi Xác thực (Auth),</text>
  <text class="box-sub" x="90" y="330">mức độ ưu tiên cao. Tôi gợi ý..."</text>
  <text class="box-sub" x="90" y="354" fill="#991b1b" font-weight="700">✗ Rất khó parse bằng code</text>

  <rect x="500" y="118" width="405" height="275" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="card-title" x="702" y="152" text-anchor="middle">Few-shot (2–3 ví dụ mẫu)</text>
  <rect x="520" y="172" width="365" height="122" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text class="mono" x="535" y="196">Input: "Thanh toán chậm" → [PERF | P2]</text>
  <text class="mono" x="535" y="220">Input: "Sai tổng tiền"   → [BILL | P1]</text>
  <text class="mono" x="535" y="244">Input: "Sai chính tả"    → [UI   | P3]</text>
  <line x1="535" y1="258" x2="870" y2="258" stroke="#cbd5e1" stroke-width="1" />
  <text class="mono" x="535" y="278" font-weight="700">Input: "Sập khi login"   →</text>

  <rect x="520" y="306" width="365" height="64" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text class="mono" x="535" y="334" font-weight="700">[AUTH | P1]</text>
  <text class="box-sub" x="535" y="356" fill="#065f46" font-weight="700">✓ Khớp chuẩn định dạng mọi lần chạy</text>

  <rect x="165" y="420" width="630" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="449" text-anchor="middle">Kinh nghiệm: Hãy thử 3–5 ví dụ đa dạng trước khi nghĩ tới việc fine-tuning</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
