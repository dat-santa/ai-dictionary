<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Suy luận từng bước Chain of Thought">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Chain of Thought (CoT): Suy luận từng bước</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">Yêu cầu LLM viết ra các bước trung gian giúp mô hình có thêm token để tính đúng trước khi chốt.</text>

  <rect x="55" y="120" width="405" height="270" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="card-title" x="257" y="154" text-anchor="middle">Hỏi thẳng (Đoán ngay 1 bước)</text>
  <rect x="75" y="176" width="365" height="72" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
  <text class="mono" x="90" y="202">Hỏi: "Server chịu 15 req/s. Khi tăng gấp</text>
  <text class="mono" x="90" y="222">4 lần và thêm 12 req admin thì tổng?"</text>

  <rect x="75" y="268" width="365" height="96" rx="10" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" />
  <text class="mono" x="90" y="298" font-weight="700">Đáp: "68 requests/sec"</text>
  <text class="box-sub" x="90" y="325" fill="#991b1b" font-weight="700">✗ Sai! Mô hình vội đoán luôn con số</text>
  <text class="box-sub" x="90" y="346">mà không viết nháp phép tính trung gian.</text>

  <rect x="500" y="120" width="405" height="270" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="card-title" x="702" y="154" text-anchor="middle">Chain of Thought (Từng bước)</text>
  <rect x="520" y="176" width="365" height="188" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text class="mono" x="535" y="204">Prompt: "...Hãy giải từng bước."</text>
  <line x1="535" y1="216" x2="870" y2="216" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="mono" x="535" y="242">Bước 1: Lưu lượng tăng = 15 × 4 = 60</text>
  <text class="mono" x="535" y="268">Bước 2: Cộng admin = 60 + 12 = 72</text>
  <text class="mono" x="535" y="302" font-weight="700" fill="#065f46">Kết quả cuối: 72 requests/sec ✓</text>
  <text class="box-sub" x="535" y="336" fill="#065f46" font-weight="700">Mỗi bước vừa viết làm điểm tựa cho bước sau</text>

  <rect x="145" y="420" width="670" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="449" text-anchor="middle">Đánh đổi: Chính xác hơn hẳn cho toán, logic, debug — nhưng tốn thêm output token</text>

  <text class="footer" x="928" y="514" text-anchor="end">Từ điển AI — datsanta.com</text>
</svg>
