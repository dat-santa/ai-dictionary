  <text x="480" y="314" text-anchor="middle" font-size="14" fill="#1e293b">Dừng hỏi trước bash, git push, xóa</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">Vừa nhanh vừa an toàn khi dev</text>
