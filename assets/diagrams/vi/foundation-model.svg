  <rect x="495" y="128" width="405" height="118" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="697" y="166" text-anchor="middle">Bot chăm sóc khách</text>
  <text class="box-sub" x="697" y="196" text-anchor="middle">Kết hợp RAG tra cứu</text>
