<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="LLM API Rate Limiting and Backoff">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 27px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="56" text-anchor="middle">Rate Limiting: RPM, TPM &amp; Retries</text>
  <text class="subtitle" x="480" y="82" text-anchor="middle">LLM APIs cap requests and tokens per minute. Exceeding either triggers HTTP 429 errors.</text>

  <!-- Step 1: App Burst -->
  <rect x="55" y="145" width="195" height="175" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="152" y="182" text-anchor="middle">1. Your App</text>
  <text class="box-sub" x="152" y="214" text-anchor="middle">Sends batch of</text>
  <text class="box-sub" x="152" y="234" text-anchor="middle">500 prompts at once</text>
  <text class="mono" x="152" y="274" text-anchor="middle">POST /completions</text>

  <line class="arrow" x1="250" y1="232" x2="298" y2="232" />
  <polyline class="arrow" points="288,224 299,232 288,240" />

  <!-- Step 2: Rate Limiter -->
  <rect x="303" y="130" width="250" height="205" rx="14" fill="#fef3c7" class="stroke-main" />
  <text class="box-title" x="428" y="166" text-anchor="middle">2. API Quota Gate</text>
  <rect x="323" y="186" width="210" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="428" y="210" text-anchor="middle">RPM: Requests / min</text>
  <text class="box-sub" x="428" y="230" text-anchor="middle">e.g. max 500 req/min</text>

  <rect x="323" y="256" width="210" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="428" y="280" text-anchor="middle">TPM: Tokens / min</text>
  <text class="box-sub" x="428" y="300" text-anchor="middle">e.g. max 100k tok/min</text>

  <!-- Two outcomes -->
  <line class="arrow" x1="553" y1="185" x2="615" y2="165" />
  <polyline class="arrow" points="603,161 616,165 608,176" />

  <line class="arrow" x1="553" y1="275" x2="615" y2="295" />
  <polyline class="arrow" points="608,284 616,295 603,299" />

  <!-- Outcome OK -->
  <rect x="620" y="125" width="285" height="90" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="mono" x="762" y="158" text-anchor="middle" fill="#065f46">HTTP 200 OK</text>
  <text class="box-sub" x="762" y="182" text-anchor="middle">Under both RPM &amp; TPM</text>
  <text class="box-sub" x="762" y="200" text-anchor="middle">→ Processed normally</text>

  <!-- Outcome 429 -->
  <rect x="620" y="242" width="285" height="112" rx="14" fill="#fee2e2" class="stroke-main" />
  <text class="mono" x="762" y="274" text-anchor="middle" fill="#991b1b">HTTP 429 Too Many Requests</text>
  <text class="box-sub" x="762" y="298" text-anchor="middle">Retry with Exponential Backoff:</text>
  <text class="mono" x="762" y="322" text-anchor="middle">wait 1s → 2s → 4s + jitter</text>

  <rect x="135" y="405" width="690" height="50" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="435" text-anchor="middle">Tip: Large prompts hit TPM limits long before RPM limits — use queues for batch jobs</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
