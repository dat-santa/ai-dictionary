<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="How Machine Learning works">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #64748b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #065f46; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <text class="title" x="480" y="64" text-anchor="middle">How Machine Learning Works</text>
  <text class="subtitle" x="480" y="92" text-anchor="middle">Instead of programming rules, you show the computer thousands of examples.</text>

  <!-- Step 1 -->
  <rect x="65" y="160" width="230" height="145" rx="14" fill="#dbeafe" class="stroke-main" />
  <text class="box-title" x="180" y="205" text-anchor="middle">1. Training Data</text>
  <text class="box-sub" x="180" y="236" text-anchor="middle">10,000 labeled photos:</text>
  <text class="box-sub" x="180" y="260" text-anchor="middle">"Cat" vs. "Dog"</text>

  <line class="arrow" x1="295" y1="232" x2="355" y2="232" />
  <polyline class="arrow" points="345,224 356,232 345,240" />

  <!-- Step 2 -->
  <rect x="362" y="160" width="236" height="145" rx="14" fill="#ede9fe" class="stroke-main" />
  <text class="box-title" x="480" y="205" text-anchor="middle">2. Learning</text>
  <text class="box-sub" x="480" y="236" text-anchor="middle">Spots patterns</text>
  <text class="box-sub" x="480" y="260" text-anchor="middle">(ears, whiskers, snout)</text>

  <line class="arrow" x1="598" y1="232" x2="658" y2="232" />
  <polyline class="arrow" points="648,224 659,232 648,240" />

  <!-- Step 3 -->
  <rect x="665" y="160" width="230" height="145" rx="14" fill="#dcfce7" class="stroke-main" />
  <text class="box-title" x="780" y="205" text-anchor="middle">3. Prediction</text>
  <text class="box-sub" x="780" y="236" text-anchor="middle">New unseen photo →</text>
  <text class="box-sub" x="780" y="260" text-anchor="middle">"97% sure it's a Cat"</text>

  <!-- Bottom note -->
  <rect x="200" y="370" width="560" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" />
  <text class="badge" x="480" y="400" text-anchor="middle">More quality examples = Better predictions over time</text>

  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>
