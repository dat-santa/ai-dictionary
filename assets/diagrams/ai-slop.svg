<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Thoughtful AI Use vs. AI Slop">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Virgil", "Segoe Print", system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #64748b; }
      .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #1e293b; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; fill: #475569; }
      .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #065f46; }
      .warn { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #991b1b; }
      .footer { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stroke-main { stroke: #1e293b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #475569; stroke-width: 2.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="540" rx="16" />
  <rect x="12" y="12" width="936" height="516" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
  <text class="title" x="480" y="56" text-anchor="middle">Thoughtful AI Use vs. AI Slop</text>
  <text class="subtitle" x="480" y="84" text-anchor="middle">AI slop is mass-produced, unedited junk content flooding feeds just for clicks.</text>
  <rect x="60" y="130" width="390" height="255" rx="16" fill="#dcfce7" class="stroke-main" />
  <text class="card-title" x="255" y="172" text-anchor="middle">Thoughtful AI-Assisted Work</text>
  <text class="box-sub" x="255" y="214" text-anchor="middle">• Starts from real human insight</text>
  <text class="box-sub" x="255" y="244" text-anchor="middle">• AI helps draft or proofread</text>
  <text class="box-sub" x="255" y="274" text-anchor="middle">• Facts checked &amp; edited cleanly</text>
  <text class="box-sub" x="255" y="304" text-anchor="middle">• Genuinely useful to readers</text>
  <rect x="510" y="130" width="390" height="255" rx="16" fill="#fee2e2" class="stroke-main" />
  <text class="card-title" x="705" y="172" text-anchor="middle">AI Slop (Junk Content)</text>
  <text class="box-sub" x="705" y="214" text-anchor="middle">• Generated in bulk with 1 prompt</text>
  <text class="box-sub" x="705" y="244" text-anchor="middle">• Generic clichés &amp; weird images</text>
  <text class="box-sub" x="705" y="274" text-anchor="middle">• Zero fact-checking or editing</text>
  <text class="box-sub" x="705" y="304" text-anchor="middle">• Wastes readers' time for clicks</text>
  <text x="480" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#475569">vs.</text>
  <rect x="80" y="418" width="800" height="48" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" />
  <text class="warn" x="480" y="447" text-anchor="middle">Good rule: If nobody bothered to read or edit it, don't publish it</text>
  <text class="footer" x="928" y="514" text-anchor="end">AI Dictionary — datsanta.com</text>
</svg>