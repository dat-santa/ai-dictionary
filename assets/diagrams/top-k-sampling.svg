  <line x1="380" y1="246" x2="580" y2="246" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="480" y="284" text-anchor="middle" font-size="14" fill="#1e293b">1. &quot;coffee&quot; (0.45)</text>
