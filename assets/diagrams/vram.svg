<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Why GPU VRAM Rules LLM Serving</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Two hardware specs decide what models fit and how fast they stream</text>

  <rect x="72" y="134" width="392" height="148" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="268" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">VRAM Capacity (GB)</text>
  <line x1="104" y1="196" x2="432" y2="196" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="268" y="228" text-anchor="middle" font-size="14" fill="#1e293b">Must hold weights + KV cache</text>
  <text x="268" y="254" text-anchor="middle" font-size="14" fill="#1e293b">70B FP16 ≈ 140 GB; 4-bit ≈ 40 GB</text>
  <rect x="496" y="134" width="392" height="148" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="692" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">VRAM Bandwidth (TB/s)</text>
  <line x1="528" y1="196" x2="856" y2="196" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="692" y="228" text-anchor="middle" font-size="14" fill="#1e293b">Governs decode streaming speed</text>
  <text x="692" y="254" text-anchor="middle" font-size="14" fill="#1e293b">Every token reads all active weights</text>
  <rect x="72" y="306" width="392" height="148" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="268" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">OOM (Out of Memory)</text>
  <line x1="104" y1="368" x2="432" y2="368" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="268" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Crash when context + batch spike</text>
  <text x="268" y="426" text-anchor="middle" font-size="14" fill="#1e293b">Fix with quantization or PagedAttention</text>
  <rect x="496" y="306" width="392" height="148" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="692" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">SRAM vs HBM</text>
  <line x1="528" y1="368" x2="856" y2="368" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="692" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Tiny fast SRAM vs large HBM</text>
  <text x="692" y="426" text-anchor="middle" font-size="14" fill="#1e293b">FlashAttention optimizes SRAM reuse</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">AI Dictionary — datsanta.com</text>
</svg>