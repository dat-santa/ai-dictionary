  <rect x="496" y="134" width="392" height="148" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="692" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Actionable Errors</text>
  <line x1="528" y1="196" x2="856" y2="196" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <text x="692" y="228" text-anchor="middle" font-size="14" fill="#1e293b">State exact cause + fix command</text>
