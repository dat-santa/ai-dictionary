  <text x="268" y="400" text-anchor="middle" font-size="14" fill="#1e293b">Provide llms.txt &amp; concise specs</text>
  <text x="268" y="426" text-anchor="middle" font-size="14" fill="#1e293b">Avoid heavy JS-only doc portals</text>
  <rect x="496" y="306" width="392" height="148" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
