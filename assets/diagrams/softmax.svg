<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="64" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Temperature Effect on Softmax</text>
  <text x="480" y="94" text-anchor="middle" font-size="15" fill="#475569">Dividing logits by temperature before softmax controls how sharp or flat odds are</text>

  <rect x="64" y="136" width="392" height="300" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="188" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">LOW TEMP (T = 0.2)</text>
  <text x="260" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Sharp, Confident Peak</text>
  <line x1="96" y1="242" x2="424" y2="242" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Logits divided by 0.2 -&gt; 5x gap</text>
  <text x="260" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Top token gets ~96% probability</text>
  <text x="260" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Consistent, factual, repeatable</text>
  <text x="260" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Best for code &amp; extraction</text>
  <rect x="504" y="136" width="392" height="300" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <rect x="628" y="156" width="144" height="28" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">HIGH TEMP (T = 1.2)</text>
  <text x="700" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Flat, Creative Spread</text>
  <line x1="536" y1="242" x2="864" y2="242" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
  <text x="700" y="280" text-anchor="middle" font-size="14.5" fill="#1e293b">Logits divided by 1.2 -&gt; closer</text>
  <text x="700" y="316" text-anchor="middle" font-size="14.5" fill="#1e293b">Top token drops to ~42% odds</text>
  <text x="700" y="352" text-anchor="middle" font-size="14.5" fill="#1e293b">Second &amp; third choices win often</text>
  <text x="700" y="388" text-anchor="middle" font-size="14.5" fill="#1e293b">Best for brainstorming &amp; stories</text>
  <circle cx="480" cy="286" r="22" fill="#0f172a"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  <text x="480" y="502" text-anchor="middle" font-size="13" fill="#94a3b8">AI Dictionary — datsanta.com</text>
</svg>